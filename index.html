<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>営業台帳ホーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1EEE2;
  --paper-dark:#E7E1CE;
  --ink:#26344B;
  --ink-soft:#5B6473;
  --rule:#B9AE8C;
  --rule-soft:#D9D2B8;
  --hanko:#B3312C;
  --card:#FBF9F2;
  --shadow: 0 2px 10px rgba(38,52,75,0.12);
  --tab-1:#6B8F71;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Zen Kaku Gothic New',sans-serif;
  min-height:100vh;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(185,174,140,0.16) 28px);
  padding:40px 20px 60px;
}
.wrap{max-width:760px;margin:0 auto;}
header{text-align:center;margin-bottom:36px;}
header h1{
  font-family:'Shippori Mincho',serif;
  font-size:28px;
  font-weight:700;
  margin:0 0 8px;
  letter-spacing:0.03em;
}
header p{
  font-size:13.5px;
  color:var(--ink-soft);
  margin:0;
}
.cards{display:flex;flex-direction:column;gap:18px;}
.card{
  display:flex;
  align-items:center;
  gap:16px;
  background:var(--card);
  border:1px solid var(--rule-soft);
  border-radius:14px;
  padding:20px 22px;
  text-decoration:none;
  color:var(--ink);
  box-shadow:var(--shadow);
  transition:transform 0.12s ease, box-shadow 0.12s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(38,52,75,0.16);}
.card:active{transform:translateY(0);}
.badge{
  flex:0 0 auto;
  width:52px;height:52px;
  border-radius:50% 44% 56% 48% / 58% 46% 62% 42%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
  color:#fff;
  font-weight:700;
  background:var(--tab-1);
}
.card-body{flex:1 1 auto;min-width:0;}
.card-body .title{
  font-family:'Shippori Mincho',serif;
  font-size:17px;
  font-weight:700;
  margin:0 0 4px;
}
.card-body .desc{
  font-size:12.5px;
  color:var(--ink-soft);
  line-height:1.6;
  margin:0;
}
.arrow{
  flex:0 0 auto;
  font-size:20px;
  color:var(--rule);
}
.empty-hint{
  text-align:center;
  font-size:12.5px;
  color:var(--ink-soft);
  border:1.5px dashed var(--rule);
  border-radius:14px;
  padding:22px;
}
footer{
  text-align:center;
  margin-top:40px;
  font-size:11.5px;
  color:var(--ink-soft);
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>営業台帳ホーム</h1>
    <p>業務ごとのツールをここから選んでください</p>
  </header>

  <div class="cards">
    <a class="card" href="https://nakaoji-tech.github.io/kyozai-daicho-hub/">
      <div class="badge">教</div>
      <div class="card-body">
        <div class="title">教材受注台帳</div>
        <p class="desc">中学校・小学校の教材受注台帳、Drive連携版など。用途に応じた台帳を選べるポータルへ移動します。</p>
      </div>
      <div class="arrow">›</div>
    </a>

    <div class="empty-hint">ここに今後のツールが追加されていきます</div>
  </div>

  <footer>このページ自体はリンク集です</footer>
</div>
</body>
</html>
